<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="65%" stop-color="#1b263b"/>
      <stop offset="100%" stop-color="#0d3b66"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a4252"/>
      <stop offset="100%" stop-color="#1b1f27"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="50%" stop-color="#ff9e64"/>
      <stop offset="100%" stop-color="#ffd60a"/>
    </linearGradient>
  </defs>
  <!-- Wartime Sky & Sea Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Sea waves at bottom -->
  <path d="M0,50 Q16,46 32,50 T64,50 L64,64 L0,64 Z" fill="#124e78" opacity="0.7"/>
  <!-- B-2 Spirit Flying Wing Silhouette (Sawtooth trailing edge) -->
  <polygon points="52,28 22,6 14,14 22,22 16,28 22,34 14,42 22,50" fill="url(#b2)" stroke="#56637a" stroke-width="1"/>
  <!-- B-2 Stealth Cockpit Windows -->
  <polygon points="44,26 38,23 39,27" fill="#7dcfff" opacity="0.85"/>
  <polygon points="44,30 38,33 39,29" fill="#7dcfff" opacity="0.85"/>
  <!-- Heavy Cruise Missile Launching -->
  <rect x="34" y="42" width="16" height="4" rx="1.5" fill="#e0e6f0"/>
  <polygon points="50,42 56,44 50,46" fill="#f7768e"/>
  <polygon points="34,42 26,40 28,44 26,48 34,46" fill="url(#fire)"/>
</svg>
